[book]
title = "TEP-Rust"
authors = ["John Kitchin"]
description = "A pure-Rust port of the Tennessee Eastman Process simulator, validated against the original Fortran."
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[output.html]
# The book is served from a subpath, `https://<host>/tep-rust/`, not from a
# domain root. `site-url` is what mdBook uses to build absolute links on the
# 404 page; without it that page emits `href="/"` and relative stylesheet
# paths, so a mistyped URL two levels deep renders unstyled and its "back to
# the book" link leaves the book entirely. Every other page uses relative
# links and does not care.
site-url = "/tep-rust/"
# Puts a GitHub icon in the book's top bar, linking every page back to the
# source. The book makes claims about specific `teprob.f` line ranges and
# specific measured numbers, and a reader who wants to check one should not
# have to guess where the repository is.
git-repository-url = "https://github.com/jkitchin/tep-rust"
git-repository-icon = "fab-github"
# And an "edit this page" link, pointing at the file that produced it.
edit-url-template = "https://github.com/jkitchin/tep-rust/edit/main/book/{path}"
mathjax-support = true
smart-punctuation = false
no-section-label = false

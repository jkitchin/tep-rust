<svg id="tep-flowsheet" viewBox="0 0 840 720" role="img" aria-labelledby="tepfs-title tepfs-desc" xmlns="http://www.w3.org/2000/svg"><title id="tepfs-title">Flowsheet of the Tennessee Eastman Process</title><desc id="tepfs-desc">Four feeds enter a plant of five unit operations. A mixing zone receives the A, D and E feeds, the compressor recycle and the stripper overhead, and discharges to the reactor. Reactor effluent passes through a condenser into the vapour-liquid separator. Separator vapour is compressed and recycled, with a purge bleeding the inert B. Separator liquid falls to a steam stripper, which is also fed the mixed A and C feed at its base and which makes the liquid product. Each stream carries its Fortran FTM index and the paper stream number, and each unit carries the XMEAS and XMV tags that sit on it.</desc><style>
#tep-flowsheet { display: block; width: 100%; height: auto; max-width: 100%; margin: 0 auto; font-family: inherit; }
#tep-flowsheet text { fill: currentColor; }
#tep-flowsheet .v { fill: currentColor; fill-opacity: 0.05; stroke: currentColor; stroke-width: 1.6; }
#tep-flowsheet .p { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#tep-flowsheet .u { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-opacity: 0.55; stroke-dasharray: 5 4; }
#tep-flowsheet .lv { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-opacity: 0.45; stroke-dasharray: 4 3; }
#tep-flowsheet .in { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-opacity: 0.7; stroke-linecap: round; }
#tep-flowsheet .rule { stroke: currentColor; stroke-width: 1; stroke-opacity: 0.3; }
#tep-flowsheet .name { font-size: 13px; font-weight: 600; }
#tep-flowsheet .sm { font-size: 11px; font-weight: 600; }
#tep-flowsheet .hd { font-size: 12px; font-weight: 600; }
#tep-flowsheet .str { font-size: 11.5px; }
#tep-flowsheet .tag { font-size: 11.5px; fill: var(--links, currentColor); }
#tep-flowsheet .note { font-size: 11px; font-style: italic; fill-opacity: 0.62; }
#tep-flowsheet .at { fill: var(--bg, transparent); stroke: var(--links, currentColor); stroke-width: 1.3; }
#tep-flowsheet .atx { font-size: 9.5px; font-weight: 600; fill: var(--links, currentColor); }
#tep-flowsheet marker path { fill: currentColor; }
#tep-flowsheet marker.uh path { fill-opacity: 0.55; }
</style><defs><marker id="tepfs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker><marker id="tepfs-au" class="uh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs>

<title id="tier5-calibration-t">Tier 5: the cross-source difference against the reference's own spread</title><desc id="tier5-calibration-d">A logarithmic scatter plot. The horizontal axis is a statistic measured between the Fortran and the Rust port; the vertical axis is the same statistic measured between two halves of the Fortran's own runs. Both axes share one scale, so the diagonal is the line of equality. 3 of 5 points lie above it, meaning the two implementations differ by less than the reference differs from itself.</desc><style>

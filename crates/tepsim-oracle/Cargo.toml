[package]
name = "tepsim-oracle"
description = "Development-only FFI harness driving the original Tennessee Eastman Fortran"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Never published. This crate links the original Fortran and exists only so the
# Rust port can be differentially tested against it.
publish = false

[features]
# Off by default: enabling it requires gfortran and the vendored Fortran sources
# under reference/. CI runs it on Linux and macOS only, never Windows.
default = []
oracle = []

[[bin]]
name = "gen-golden-trace"
path = "src/bin/gen_golden_trace.rs"
required-features = ["oracle"]

[[bin]]
name = "gen-rng-vectors"
path = "src/bin/gen_rng_vectors.rs"
required-features = ["oracle"]

[dependencies]
# The Tier 1 pools produce `Composition` values, so the harness needs the core
# vocabulary. The dependency runs this way only: nothing shipped may depend on
# the oracle, and `cargo xtask ci` asserts it.
tepsim-core.workspace = true

[dev-dependencies]
# Only for verifying the vendored reference material has not been edited.
sha2 = "0.10"

[lints]
workspace = true

[package]
name = "tepsim-oracle"
description = "Development-only FFI harness driving the original Tennessee Eastman Fortran"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Never published. This crate links the original Fortran and exists only so the
# Rust port can be differentially tested against it.
publish = false

[features]
# Off by default: enabling it requires gfortran and the vendored Fortran sources
# under reference/. CI runs it on Linux and macOS only, never Windows.
default = []
oracle = []
# Forwards to `tepsim-core/libm-system`, so that a Tier 2 differential can be
# run with the port using the same libm gfortran does. That separates a
# transcendental rounding difference from a mistake in the algebra; see
# `tepsim_core::math`.
libm-system = ["tepsim-core/libm-system"]

[[bin]]
name = "gen-golden-trace"
path = "src/bin/gen_golden_trace.rs"
required-features = ["oracle"]

[[bin]]
name = "gen-rng-vectors"
path = "src/bin/gen_rng_vectors.rs"
required-features = ["oracle"]

[dependencies]
# The Tier 1 pools produce `Composition` values, so the harness needs the core
# vocabulary. The dependency runs this way only: nothing shipped may depend on
# the oracle, and `cargo xtask ci` asserts it.
tepsim-core.workspace = true
# The control layer, for the Phase 4 differentials.
tepsim-control.workspace = true
# The facade, so that Tier 5 drives the same loop a user does.
tepsim.workspace = true
# The statistics, for the Tier 5 battery. Development-only on both sides of
# this edge, so it does not weaken the isolation rule.
tepsim-stats.workspace = true
# For `fabs` in the battery, matching the vendored libm the statistics use.
libm = { version = "0.2.16", default-features = false }

[dev-dependencies]
# Only for verifying the vendored reference material has not been edited.
sha2 = "0.10"

[lints]
workspace = true

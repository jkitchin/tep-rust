[package]
name = "tepsim-stats"
description = "DEV ONLY: the statistics behind TEP-Rust's validation ladder, in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# The same vendored libm the model uses, so a statistic computed here rounds
# the same way on x86-64, aarch64 and wasm32.
libm = { version = "0.2.16", default-features = false }

# For the book's detector tutorial, which is `examples/a_detector.rs` and is
# pinned to the page by `crates/tepsim/tests/book_examples.rs`. A dev-dependency
# only, and the direction is the safe one: this crate is dev-only, so nothing
# shipped becomes reachable from it.
[dev-dependencies]
tepsim.workspace = true

[lints]
workspace = true

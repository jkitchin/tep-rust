[package]
name = "xtask"
description = "Build, gate and validation automation for the tep-rust workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Almost dependency-free: this runs at the top of every development session, so
# its compile time is a tax on every iteration. The one dependency is the golden
# trace format, taken with default features so no Fortran toolchain is involved.
[dependencies]
tepsim-oracle.workspace = true
# `xtask fidelity` runs the port against the committed trace, so it needs the
# model. Dev-only, like the rest of xtask; nothing shipped depends on xtask.
tepsim-core.workspace = true
# `xtask tier9` needs the committed determinism table and has to run it, which
# is the facade's job rather than the core's. No new transitive dependency:
# tepsim is tepsim-core plus tepsim-control and tepsim-scenario, all of which
# are already in this tree.
tepsim.workspace = true

[lints]
workspace = true

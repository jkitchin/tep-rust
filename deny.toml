# cargo-deny configuration.
#
# The allow-list is deliberately narrow. A new dependency dragging in an
# unexpected licence should fail the gate loudly rather than surface at publish
# time. Widening this list is a decision, so it gets a log entry.

[graph]
all-features = false

[licenses]
# MIT covers new work here; NCSA covers the portions derived from the original
# Tennessee Eastman Fortran and cannot be dropped. See NOTICE.md.
allow = ["MIT", "NCSA"]
confidence-threshold = 0.93

# Per-crate exceptions rather than a wider `allow`, so each one names what it
# is for and a fourth licence cannot slip in behind it. All three arrived with
# the PyO3 bindings in phase 7.
exceptions = [
    # rust-numpy, the only one of the three that is linked into a shipped
    # artifact. It is the standard NumPy interop crate, and the Python package
    # already depends on NumPy itself, which is BSD-3-Clause: refusing
    # BSD-2-Clause here while shipping a wheel that requires NumPy would be a
    # distinction without a difference.
    { name = "numpy", allow = ["BSD-2-Clause"] },
    # Build-time only, both of them: they run on the build machine and no part
    # of either reaches the wheel or the wasm bundle.
    # `pyo3-build-config` uses target-lexicon to parse target triples.
    { name = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
    # `proc-macro2` and `syn` use unicode-ident to classify identifier
    # characters, which needs the Unicode character database's own licence.
    { name = "unicode-ident", allow = ["Unicode-3.0"] },
]

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Determinism is a hard invariant: the plant must produce identical bits on
# x86-64, aarch64 and wasm32. Data parallelism inside the core would reorder
# floating-point reductions, so it is banned outright rather than reviewed.
# Parallelism belongs one level up, across independent runs.
deny = [
    { name = "rayon" },
    { name = "rayon-core" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

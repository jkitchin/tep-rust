# Publishes the book and TEP Studio to GitHub Pages.
#
# The site is assembled from two things that build very differently.
#
# The book needs no toolchain. `cargo xtask validate` writes the generated
# validation chapters and `cargo xtask deltas` writes the delta marker index,
# and both are committed, so mdBook alone is enough.
#
# The notebooks are the book's worked examples, and they need no toolchain
# either, deliberately. They are committed with their outputs and plots, and
# `nbconvert --to html` renders exactly what is committed. It is NOT given
# `--execute`: doing so would drag in the whole wheel build, Rust and all, to
# recompute results that are already in the file, and it would let a CI run
# silently publish numbers that differ from the ones the author reviewed. What
# guards the committed outputs instead is `book_examples.rs`, which fails if a
# notebook was committed with its cells unexecuted and, under `TEP_BOOK=1`,
# re-executes all four against the current build.
#
# The studio does need one: `apps/studio/dist` is gitignored on purpose, so
# what gets deployed is built here from `crates/tepsim-wasm` rather than from
# a checked-in artifact that could silently drift from the source.
#
# Both tool versions are pinned, for the reason `rust-toolchain.toml` pins
# rustc: a renderer or a code generator that moves under you turns a
# documentation diff into a mystery. wasm-bindgen in particular *must* match
# the library version exactly, because the glue and the module share a private
# ABI, so the version is read out of `Cargo.lock` rather than typed here.
name: pages

on:
  push:
    branches: [main]
    # Only when something the site is made of moves.
    paths:
      - 'book/**'
      - 'notebooks/**'
      - 'apps/studio/**'
      - 'crates/tepsim-wasm/**'
      - 'crates/tepsim/**'
      - 'crates/tepsim-core/**'
      - 'crates/tepsim-control/**'
      - 'crates/tepsim-scenario/**'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: read the repo, and mint the token `deploy-pages` needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer commit win. `cancel-in-progress: false`
# would queue them and publish an older site after a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.4
  BINARYEN_VERSION: "132"

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung job bills until it is killed, and the default cap is six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # --- the book -----------------------------------------------------

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versions, recorded rather than assumed
        run: mdbook --version

      - name: Build the book
        run: mdbook build book

      # --- the notebooks ------------------------------------------------

      # Render only. No kernel is started and no cell is run, so this needs
      # neither the wheel nor Rust nor numpy, and it takes seconds. See the
      # header of this file for why executing here would be worse rather than
      # more thorough.
      - name: Install nbconvert
        run: pip install --disable-pip-version-check nbconvert

      - name: Render the notebooks
        run: |
          set -euo pipefail
          jupyter nbconvert --version
          jupyter nbconvert --to html \
            --output-dir _notebooks \
            notebooks/*.ipynb
          ls -l _notebooks

      # --- the studio ---------------------------------------------------

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The version the library is built against. `apps/studio/build.sh` reads
      # the same field the same way and refuses to run on a mismatch; this
      # installs what that check is going to demand.
      - name: Install wasm-bindgen-cli, at the version Cargo.lock pins
        run: |
          set -euo pipefail
          wanted="$(awk '/^name = "wasm-bindgen"$/ { f = 1; next }
                         f && /^version = / { gsub(/[",]/, "", $3); print $3; exit }' Cargo.lock)"
          echo "Cargo.lock wants wasm-bindgen $wanted"
          cargo install wasm-bindgen-cli --version "$wanted" --locked

      # binaryen for wasm-opt, pinned to a release rather than taken from apt.
      #
      # `apt install binaryen` on ubuntu-latest gives version 108, from 2021,
      # and it failed this build outright: rustc 1.97 emits `i32.extend16_s`
      # and a wasm-opt that old rejects sign-extension at validation. The
      # `--enable-sign-ext` flag `build.sh` now passes fixes that, but the
      # deeper problem is that an unpinned four-year-old optimiser is not
      # something to hand the shipped artifact to. Pinned, like mdBook above
      # and like rustc in `rust-toolchain.toml`.
      #
      # Note what checks this: `apps/studio/node/deployed.test.mjs` runs the
      # built module and asserts it still produces the Tier 9 digest, so an
      # optimiser that changed a floating-point result would fail the build
      # rather than quietly publish different numbers.
      - name: Install binaryen ${{ env.BINARYEN_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: wasm-opt version, recorded rather than assumed
        run: wasm-opt --version

      - name: Build the studio
        run: apps/studio/build.sh

      # Including `deployed.test.mjs`, which asserts the module that just came
      # out of wasm-bindgen and wasm-opt still computes the Tier 9 digest.
      # Publishing a studio whose numbers had shifted would be the worst kind
      # of failure here: silent, and on the page users actually reach.
      - name: Test the studio, including the built module
        run: npm --prefix apps/studio test --silent

      # --- assemble -----------------------------------------------------

      # The book at the root, the studio and the notebooks one level down, so
      # the published URLs are `<site>/`, `<site>/studio/` and
      # `<site>/notebooks/`. `book.toml` sets `site-url` to match, which is what
      # makes the book's 404 page resolve correctly from a subpath.
      #
      # `<site>/notebooks/` is the path the book's links assume, and
      # `book_examples.rs::every_notebook_link_resolves` resolves each link
      # against the page carrying it and asserts it lands exactly there. That
      # matters because the same notebook is `notebooks/x.html` from
      # `python.html` and `../notebooks/x.html` from `tutorials/x.html`.
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r book/book/. _site/
          mkdir -p _site/studio
          cp -r apps/studio/dist/. _site/studio/
          mkdir -p _site/notebooks
          cp -r _notebooks/. _site/notebooks/

      # All three parts have to be there, and the studio has to have its wasm.
      # Without this a broken build publishes an empty directory and the only
      # symptom is a 404 that nobody sees until they visit. The notebook count
      # is asserted rather than eyeballed for the same reason: the book links
      # to every one of them by name, so a render that quietly dropped one
      # would publish four dead links.
      - name: The site has all three parts
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/python.html
          test -f _site/studio/index.html
          test -f _site/studio/js/tepsim_wasm_bg.wasm
          notebooks=$(find _site/notebooks -name '*.html' | wc -l)
          sources=$(find notebooks -name '*.ipynb' | wc -l)
          echo "$notebooks rendered notebook(s) from $sources source(s)"
          test "$notebooks" -eq "$sources"
          pages=$(find _site -name '*.html' | wc -l)
          wasm=$(du -h _site/studio/js/tepsim_wasm_bg.wasm | cut -f1)
          echo "$pages HTML page(s); wasm module $wasm"
          test "$pages" -gt 10

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A hung job bills until it is killed, and the default cap is six hours.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

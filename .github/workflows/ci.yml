name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate, on Linux only.
  #
  # It ran on all three runners until 2026-08-29. What that bought, measured
  # rather than assumed the first time the matrix actually completed, was one
  # genuine finding: the Windows runner *does* ship gfortran, contrary to the
  # comment that used to sit here, so `xtask ci` tried to build the oracle
  # there and `f951.exe` could not parse the extended-length `\\?\` path that
  # `fs::canonicalize` produces. That is now handled by policy in
  # `xtask::oracle_supported`, which refuses Windows outright, matching what
  # `CLAUDE.md` always said.
  #
  # Everything else the Windows and macOS gate rows checked is checked
  # elsewhere: the wheels workflow still builds and smoke-tests wheels on
  # Windows and macOS, which is where cross-platform breakage would actually
  # reach a user; and `tepsim-core` is `no_std` with no platform-specific code
  # to diverge. Three full gates for that was not paying for itself.
  #
  # This comment used to add "and the oracle job still runs on macOS, so a
  # second gfortran is covered". It does not, as of the commit that carries
  # this line; see the oracle job for what that costs.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      # Before checkout, and it has to be: crates/tepsim-py/{LICENSE,
      # LICENSE-NCSA,NOTICE.md} are symlinks to the repository root, and Git for
      # Windows ships with core.symlinks=false in its system config. Without
      # this, git writes the target *path* as the file body and the licence
      # texts become the 13-byte string "../../LICENSE". `xtask ci` checks for
      # exactly that and fails, which is the point, but the fix belongs here.
      - name: Let git create symlinks (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - uses: actions/checkout@v4

      # No @stable: rust-toolchain.toml pins the version, and an action that
      # installs its own would silently validate with a different compiler.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The pytest suite for the bindings only exists once a wheel is built and
      # installed, so `cargo test` cannot reach it. `xtask ci` builds one and
      # runs the suite against it when maturin is here, and says it is skipping
      # when it is not. Installing maturin is what makes those tests part of the
      # gate on all three platforms rather than a thing someone runs by hand.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install maturin
        run: pipx install maturin

      - name: cargo xtask ci
        run: cargo xtask ci --fast

  # Differential testing against the original Fortran. Linux only.
  #
  # Windows was never here: gfortran on Windows runners is toolchain trouble
  # that buys nothing, since the oracle is a development instrument and never
  # shipped. macOS left on 2026-08-29 for cost. It was 335 of the account's
  # ~1100 billed Actions minutes that month, on its own -- macOS runners bill
  # at 10x, and this job installs gcc from Homebrew on every run.
  #
  # Know what that gives up. Bit-exactness against the Fortran is now claimed
  # from *one* gfortran on *one* architecture. A divergence that only appears
  # under Homebrew's gfortran, or only on aarch64, will not be caught here.
  # Re-baselining after a compiler change (see CLAUDE.md) is likewise a
  # single-platform measurement now. If that matters more than the minutes,
  # restore `macos-latest` here *and* the `brew install gcc` step this commit
  # removed with it, or run the pair on a schedule rather than per push.
  oracle:
    name: oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran

      # The reference numbers depend on the compiler, so record it. A gfortran
      # change is a deliberate re-baseline, not a regression: see CLAUDE.md.
      - name: Record gfortran version
        run: gfortran --version | head -1

      - name: Oracle differential tests
        run: cargo test -p tepsim-oracle --features oracle

  # Determinism is a hard invariant, so wasm32 is built on every change rather
  # than only when the browser app is touched.
  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wasm32 target comes from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build core for wasm32
        run: cargo build -p tepsim-core -p tepsim-wasm --target wasm32-unknown-unknown

  # The core contains no unsafe, so this should be uneventful. It is here to
  # stay uneventful.
  miri:
    name: miri (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      # `+nightly` is required: rust-toolchain.toml would otherwise override the
      # nightly this job just installed, and miri is not in the pinned stable.
      #
      # `--lib` only: miri is here to check for undefined behaviour, and the
      # integration tests read the vendored Fortran from disk, which miri
      # forbids without disabling isolation. Relaxing isolation to run tests
      # that cannot exhibit UB would weaken the check for nothing.
      #
      # That scoping is not enough on its own, which this job proved the first
      # time it ran in 180 commits: `stream.rs`'s citation tests are *unit*
      # tests, inside `--lib`, and they read `teprob.f` with
      # `std::fs::read_to_string`. Miri aborted the whole job. They use
      # `include_str!` now, so the file is read at compile time and no unit
      # test in `tepsim-core` touches the filesystem. Keep it that way: a unit
      # test that needs a file either includes it or belongs in `tests/`.
      - name: Miri on tepsim-core
        run: cargo +nightly miri test -p tepsim-core --lib

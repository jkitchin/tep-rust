name: CI

on:
  push:
    branches: [main]
    # A commit that only moves prose cannot break the build, and this
    # repository moves a lot of prose. `pages.yml` still publishes it.
    paths-ignore:
      - 'book/**'
      - 'notebooks/**'
      - '**.org'
      - '**.md'
      - 'LICENSE*'
      - 'NOTICE*'
      - '.github/workflows/pages.yml'
  pull_request:
  # Miri, once a week. See the `miri` job below.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux only. Every job in this file is, deliberately.
  #
  # # Why there is no Windows or macOS job any more
  #
  # Cost. macOS runners bill at ten times a Linux minute and Windows at twice,
  # and between them they were the large majority of this repository's Actions
  # usage. Removed on 2026-08-29 at 90% of the allotment.
  #
  # Windows had already earned its keep once and been paid off: the first full
  # matrix run in 180 commits found that the Windows runner *does* ship
  # gfortran, so `xtask ci` tried to build the oracle there and `f951.exe`
  # could not parse the extended-length `\\?\` path `fs::canonicalize`
  # produces. That is fixed by policy in `xtask::oracle_supported`, which
  # refuses Windows outright, so the finding is now permanent rather than
  # something a Windows runner has to rediscover.
  #
  # # What this gives up, stated plainly rather than waved away
  #
  # There is no longer an aarch64 leg and no second gfortran on any automatic
  # run. The bit-exactness claim rests on one compiler on one architecture.
  # `cargo xtask tier9` on any other machine still completes the determinism
  # claim, because the Tier 9 digests are committed constants rather than a
  # value computed twice, and the wheels workflow still builds and smoke-tests
  # on Windows and macOS when a release is tagged. Neither is automatic on a
  # push, and that is the trade that was made.
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung job bills until it is killed, and the default cap is six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # No @stable: rust-toolchain.toml pins the version, and an action that
      # installs its own would silently validate with a different compiler.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The pytest suite for the bindings only exists once a wheel is built and
      # installed, so `cargo test` cannot reach it. `xtask ci` builds one and
      # runs the suite against it when maturin is here, and says it is skipping
      # when it is not. Installing maturin is what makes those tests part of the
      # gate on all three platforms rather than a thing someone runs by hand.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install maturin
        run: pipx install maturin

      - name: cargo xtask ci
        run: cargo xtask ci --fast

  # Differential testing against the original Fortran. Linux only, and never
  # Windows: gfortran there is a source of toolchain trouble that buys
  # nothing, since the oracle is a development instrument and never shipped.
  # The Fortran differential, on Linux, on every change. This is the job that
  # holds the project's central claim, so it is never off the push path.
  oracle:
    name: oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung job bills until it is killed, and the default cap is six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran

      # The reference numbers depend on the compiler, so record it. A gfortran
      # change is a deliberate re-baseline, not a regression: see CLAUDE.md.
      - name: Record gfortran version
        run: gfortran --version | head -1

      - name: Oracle differential tests
        run: cargo test -p tepsim-oracle --features oracle

  # Determinism is a hard invariant, so wasm32 is built on every change rather
  # than only when the browser app is touched.
  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    # A hung job bills until it is killed, and the default cap is six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The wasm32 target comes from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build core for wasm32
        run: cargo build -p tepsim-core -p tepsim-wasm --target wasm32-unknown-unknown

  # The core contains no unsafe, so this should be uneventful. It is here to
  # stay uneventful.
  # Weekly, and on demand.
  #
  # Miri is the second-largest line item at about fourteen minutes, and what it
  # checks is a crate that is `forbid(unsafe_code)`. The chance a given commit
  # introduces undefined behaviour there is close to zero, and the chance it
  # does so without any other test noticing is smaller still. It stays because
  # "close to zero" is not zero, and it moves off the push path because paying
  # fourteen minutes a commit for it is not proportionate.
  miri:
    name: miri (core, weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A hung job bills until it is killed, and the default cap is six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      # `+nightly` is required: rust-toolchain.toml would otherwise override the
      # nightly this job just installed, and miri is not in the pinned stable.
      #
      # `--lib` only: miri is here to check for undefined behaviour, and the
      # integration tests read the vendored Fortran from disk, which miri
      # forbids without disabling isolation. Relaxing isolation to run tests
      # that cannot exhibit UB would weaken the check for nothing.
      #
      # That scoping is not enough on its own, which this job proved the first
      # time it ran in 180 commits: `stream.rs`'s citation tests are *unit*
      # tests, inside `--lib`, and they read `teprob.f` with
      # `std::fs::read_to_string`. Miri aborted the whole job. They use
      # `include_str!` now, so the file is read at compile time and no unit
      # test in `tepsim-core` touches the filesystem. Keep it that way: a unit
      # test that needs a file either includes it or belongs in `tests/`.
      - name: Miri on tepsim-core
        run: cargo +nightly miri test -p tepsim-core --lib
